
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIYAM SM CHAT - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf3ff, #d5e7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,50,120,0.12);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 22px;
      border-radius: 25px;
      background: linear-gradient(135deg,#1680ff,#06459d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      color: #124b91;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #78889e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      color: #344054;
      border: 1px solid #d7e2f0;
    }

    .google-btn:active {
      background: #f3f7fc;
    }

    .google-icon {
      font-size: 22px;
      font-weight: bold;
      color: #4285F4;
    }

    .logout-btn {
      background: #1769e0;
      color: white;
    }

    .footer {
      color: #9aa8ba;
      font-size: 12px;
      margin-top: 30px;
    }

    #message {
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #16834a;
    }

    .error {
      color: #d12c2c;
    }

    .hidden {
      display: none;
    }

    .user-email {
      color: #1769e0;
      font-size: 14px;
      margin: 15px 0 22px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN SCREEN -->
  <section id="loginScreen">

    <div class="logo">SM</div>

    <h1>SIYAM SM CHAT</h1>

    <p class="subtitle">
      Welcome to SIYAM SM CHAT<br>
      আপনার Google অ্যাকাউন্ট দিয়ে লগইন করুন
    </p>

    <button
      class="google-btn"
      id="googleBtn"
      onclick="googleLogin()"
    >
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <p class="footer">
      Secure Login • SIYAM SM CHAT
    </p>

  </section>

  <!-- SUCCESS SCREEN -->
  <section id="successScreen" class="hidden">

    <div class="logo">SM</div>

    <h1>Welcome!</h1>

    <p class="subtitle">
      SIYAM SM CHAT-এ স্বাগতম।
      আপনার Google অ্যাকাউন্ট সফলভাবে যুক্ত হয়েছে।
    </p>

    <p id="userEmail" class="user-email"></p>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Sign Out
    </button>

  </section>

  <p id="message"></p>

</div>


<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDIpeeJm_vHkWjrvUAd91dGfd1VgcIE7Gw",
  authDomain: "siyam-sm-30d12.firebaseapp.com",
  projectId: "siyam-sm-30d12",
  storageBucket: "siyam-sm-30d12.firebasestorage.app",
  messagingSenderId: "627521948033",
  appId: "1:627521948033:web:94f8ec26760a9320368080",
  measurementId: "G-NYW7DQ9DCM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
provider.setCustomParameters({
  prompt: "select_account"
});

function showMessage(text, type = "") {
  const message = document.getElementById("message");
  message.textContent = text;
  message.className = type;
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("successScreen").classList.add("hidden");
}

function showSuccess(user) {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("successScreen").classList.remove("hidden");

  document.getElementById("userEmail").textContent =
    user.email || "Google account connected";

  showMessage("সফলভাবে লগইন হয়েছে!", "success");
}

window.googleLogin = async function() {
  const button = document.getElementById("googleBtn");

  try {
    button.disabled = true;
    button.textContent = "Please wait...";
    showMessage("Google Login হচ্ছে...");

    const result = await signInWithPopup(auth, provider);

    showSuccess(result.user);

  } catch (error) {
    console.error("Google Login Error:", error);

    showMessage(
      "লগইন সমস্যা: " + error.code + " — " + error.message,
      "error"
    );

    button.disabled = false;
    button.innerHTML =
      '<span class="google-icon">G</span> Continue with Google';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    showSuccess(user);
  } else {
    showLogin();
  }
});

window.logout = async function() {
  try {
    await signOut(auth);
    showLogin();
    showMessage("আপনি লগআউট করেছেন।", "success");
  } catch (error) {
    showMessage("লগআউট সমস্যা: " + error.message, "error");
  }
};
</script>


</body>
</html>
