
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIYAM SM CHAT - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf3ff, #d5e7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,50,120,0.12);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 22px;
      border-radius: 25px;
      background: linear-gradient(135deg,#1680ff,#06459d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      color: #124b91;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #78889e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d7e2f0;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #1680ff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:active {
      background: #06459d;
    }

    .hidden {
      display: none;
    }

    .back {
      background: transparent;
      color: #1769e0;
      margin-top: 15px;
    }

    .footer {
      color: #9aa8ba;
      font-size: 12px;
      margin-top: 30px;
    }

    #message {
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #16834a;
    }

    .error {
      color: #d12c2c;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN SCREEN -->

  <section id="loginScreen">

    <div class="logo">SM</div>

    <h1>SIYAM SM CHAT</h1>

    <p class="subtitle">
      Welcome to SIYAM SM CHAT<br>
      আপনার ফোন নম্বর দিয়ে লগইন করুন
    </p>

    <input
      type="tel"
      id="phone"
      placeholder="+880 1XXXXXXXXX"
      autocomplete="tel"
    >

    <div id="recaptcha-container"></div>

    <button id="sendBtn" onclick="sendOTP()">
      Send OTP
    </button>

    <p class="footer">
      Secure Login • SIYAM SM CHAT
    </p>

  </section>


  <!-- OTP SCREEN -->

  <section id="otpScreen" class="hidden">

    <div class="logo">SM</div>

    <h1>Verify Your Number</h1>

    <p class="subtitle">
      আপনার ফোনে পাঠানো ৬ সংখ্যার OTP লিখুন
    </p>

    <input
      type="text"
      id="otp"
      maxlength="6"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="Enter OTP"
    >

    <button id="verifyBtn" onclick="verifyOTP()">
      Verify OTP
    </button>

    <button class="back" onclick="goBack()">
      Back to Login
    </button>

  </section>


  <!-- SUCCESS SCREEN -->

  <section id="successScreen" class="hidden">

    <div class="logo">SM</div>

    <h1>Welcome!</h1>

    <p class="subtitle">
      SIYAM SM CHAT-এ স্বাগতম।
      আপনার নম্বর সফলভাবে যাচাই হয়েছে।
    </p>

  </section>

  <p id="message"></p>

</div>


<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyDIpeeJm_vHkWjrvUAd91dGfd1VgcIE7Gw",
  authDomain: "siyam-sm-30d12.firebaseapp.com",
  projectId: "siyam-sm-30d12",
  storageBucket: "siyam-sm-30d12.firebasestorage.app",
  messagingSenderId: "627521948033",
  appId: "1:627521948033:web:94f8ec26760a9320368080",
  measurementId: "G-NYW7DQ9DCM"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

auth.languageCode = "bn";

let confirmationResult = null;
let recaptchaVerifier = null;


// MESSAGE FUNCTION

function showMessage(text, type = "") {
  const message = document.getElementById("message");
  message.textContent = text;
  message.className = type;
}


// BANGLADESH PHONE NUMBER FORMAT

function formatPhoneNumber(value) {

  let phone = value.replace(/[\s-]/g, "");

  if (/^01[3-9][0-9]{8}$/.test(phone)) {
    phone = "+88" + phone;

  } else if (/^8801[3-9][0-9]{8}$/.test(phone)) {
    phone = "+" + phone;
  }

  if (!/^\+8801[3-9][0-9]{8}$/.test(phone)) {
    throw new Error("সঠিক বাংলাদেশি মোবাইল নম্বর লিখুন।");
  }

  return phone;
}


// SEND OTP

window.sendOTP = async function() {

  const button = document.getElementById("sendBtn");

  try {

    showMessage("");

    const phone = formatPhoneNumber(
      document.getElementById("phone").value
    );

    button.disabled = true;
    button.textContent = "Sending OTP...";

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }

    recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "invisible"
      }
    );

    await recaptchaVerifier.render();

    confirmationResult = await signInWithPhoneNumber(
      auth,
      phone,
      recaptchaVerifier
    );

    document.getElementById("loginScreen")
      .classList.add("hidden");

    document.getElementById("otpScreen")
      .classList.remove("hidden");

    showMessage(
      "OTP পাঠানো হয়েছে। আপনার SMS দেখুন।",
      "success"
    );

  } catch(error) {

    console.error(error);

    let errorText = error.message;

    if (error.code === "auth/invalid-phone-number") {
      errorText = "ফোন নম্বরটি সঠিক নয়।";

    } else if (error.code === "auth/too-many-requests") {
      errorText = "অনেকবার চেষ্টা হয়েছে। পরে আবার চেষ্টা করুন।";

    } else if (error.code === "auth/quota-exceeded") {
      errorText = "SMS পাঠানোর সীমা অতিক্রম হয়েছে।";

    } else if (error.code === "auth/captcha-check-failed") {
      errorText = "reCAPTCHA যাচাই ব্যর্থ হয়েছে।";
    }

    showMessage("OTP পাঠানো যায়নি: " + errorText, "error");

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }

  } finally {

    button.disabled = false;
    button.textContent = "Send OTP";

  }

};


// VERIFY OTP

window.verifyOTP = async function() {

  const button = document.getElementById("verifyBtn");

  const otp = document.getElementById("otp")
    .value.trim();

  if (!/^[0-9]{6}$/.test(otp)) {
    showMessage("৬ সংখ্যার সঠিক OTP লিখুন।", "error");
    return;
  }

  if (!confirmationResult) {
    showMessage("আগে OTP পাঠাতে হবে।", "error");
    return;
  }

  try {

    button.disabled = true;
    button.textContent = "Verifying...";

    const result = await confirmationResult.confirm(otp);

    if (result.user) {

      document.getElementById("otpScreen")
        .classList.add("hidden");

      document.getElementById("successScreen")
        .classList.remove("hidden");

      showMessage(
        "ফোন নম্বর সফলভাবে যাচাই হয়েছে!",
        "success"
      );
    }

  } catch(error) {

    console.error(error);

    if (
      error.code === "auth/invalid-verification-code"
    ) {
      showMessage("OTP ভুল হয়েছে। আবার চেষ্টা করুন।", "error");

    } else if (
      error.code === "auth/code-expired"
    ) {
      showMessage("OTP-এর মেয়াদ শেষ হয়েছে। নতুন OTP নিন।", "error");

    } else {
      showMessage("যাচাই করা যায়নি: " + error.message, "error");
    }

  } finally {

    button.disabled = false;
    button.textContent = "Verify OTP";

  }

};


// BACK TO LOGIN

window.goBack = function() {

  document.getElementById("otpScreen")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  showMessage("");

};

</script>

</body>
</html>
